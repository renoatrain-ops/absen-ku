name: absensi_digital
description: A Flutter app for digital attendance using front camera QR scan
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  mobile_scanner: ^7.0.0
  intl: ^0.19.0
  provider: ^6.0.0
  http: ^0.13.0
  sqflite: ^2.2.8
  path_provider: ^2.0.15
  path: ^1.8.3
  pdf: ^3.10.1
  printing: ^5.12.0
  share_plus: ^13.3.0
  url_launcher: ^6.1.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
